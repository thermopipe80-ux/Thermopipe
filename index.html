<style>
:root{--bg:#f3f6f4;--cd:#fff;--tx:#14231a;--mu:#66756b;--bd:#dfe6e1;--gn:#12813f;--gd:#0c5f2e;--gl:#e4f4ea;--red:#c8181d;--bl:#1b8dbb;--in:#f7faf8;--ok:#e1f5e8;--wn:#fff1c9;--cr:#fde0e0;--bk:#d9dcdf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1712;--cd:#16211a;--tx:#e5efe8;--mu:#93a599;--bd:#26362b;--gl:#173a26;--in:#1c2a21;--ok:#164a2c;--wn:#5a4a10;--cr:#5c1f1f;--bk:#3a3f44}}
:root[data-theme=dark]{--bg:#0e1712;--cd:#16211a;--tx:#e5efe8;--mu:#93a599;--bd:#26362b;--gl:#173a26;--in:#1c2a21;--ok:#164a2c;--wn:#5a4a10;--cr:#5c1f1f;--bk:#3a3f44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--cd);border-right:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px;overflow:auto;z-index:30;transition:width .15s}
.lg{padding:2px 4px 12px}.lg img{background:#fff;border-radius:8px;padding:4px;display:block;width:100%;max-width:200px}.lg img.mk{display:none;width:40px;padding:2px}
#side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--tx);cursor:pointer;margin:1px 0;border-left:3px solid transparent}
#side a:hover{background:var(--in)}#side a.on{background:var(--gl);color:var(--gd);border-left-color:var(--gn);font-weight:600}
:root[data-theme=dark] #side a.on{color:#7be0a2}#side hr{border:0;border-top:1px solid var(--bd);margin:8px 4px}.ic{width:20px;text-align:center}
#wrap{margin-left:232px;transition:margin .15s}body.col #side{width:60px}body.col #wrap{margin-left:60px}body.col .lb,body.col .lg img.full{display:none}body.col .lg img.mk{display:block}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 14px}#top h1{font-size:16px;margin:0;flex:1}
#main{padding:14px;max-width:1400px}#ov{display:none}
@media(max-width:800px){#side{transform:translateX(-100%);width:250px!important}#side.open{transform:none}body.col .lb{display:inline}body.col .lg img.full{display:block}body.col .lg img.mk{display:none}#wrap,body.col #wrap{margin:0}#ov.open{display:block;position:fixed;inset:0;background:#0006;z-index:25}#main{padding:8px}.sr{width:100%!important}
.rt table,.rt tr,.rt td{display:block;min-width:0}.rt tr:first-child{display:none}.rt tr{border:1px solid var(--bd);border-radius:8px;margin:6px 0;padding:4px}.rt td{display:flex;justify-content:space-between;border:0;padding:2px 6px}.rt td:before{content:attr(data-label);color:var(--mu)}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;overflow-x:auto;box-shadow:0 1px 3px #10281a14}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}.g2 .card{margin:0}
.k{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--gn);border-radius:10px;padding:10px 12px}.k.r{border-left-color:var(--red)}.k.b{border-left-color:var(--bl)}.k.y{border-left-color:#e0a800}
.k span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.k b{display:block;font-size:22px;margin:2px 0}.k small{color:var(--mu)}
h2{margin:0 0 10px;font-size:16px}h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--mu);background:var(--in)}.rt th{cursor:pointer}.rt tr:hover td{background:var(--in)}tr[onclick]{cursor:pointer}
input,select{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--tx);font:inherit;max-width:100%}
input:focus,select:focus{outline:2px solid var(--gn);outline-offset:-1px}input.in{width:88px}input.w{width:140px}
button{padding:7px 12px;border:0;border-radius:6px;background:var(--gn);color:#fff;cursor:pointer;font:inherit;margin:2px}button:hover{background:var(--gd)}button.g{background:var(--mu)}button.r{background:var(--red)}
.chip{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:99px}.chip.on{background:var(--gn);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}
.bd{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}.bd.ok{background:var(--ok)}.bd.wn{background:var(--wn)}.bd.cr{background:var(--cr)}.bd.bk{background:var(--bk)}
.pb{display:inline-block;width:70px;height:6px;background:var(--bd);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.pb b{display:block;height:100%;background:var(--gn)}.pb.wn b{background:#e0a800}.pb.cr b{background:var(--red)}.pb.bk b{background:#555}
.bar{height:12px;background:var(--gn);border-radius:3px;min-width:2px}.tb{display:flex;gap:10px;align-items:center;margin-bottom:8px}.sr{width:260px}.pg{text-align:right;margin-top:8px}
.tree,.tree ul{list-style:none;margin:0;padding-left:20px;border-left:2px solid var(--bd)}.tree{border:0;padding:0}.tree li{padding:3px 0}
.mu{color:var(--mu)}.gr{background:var(--ok)}.ye{background:var(--wn)}.rd{background:var(--cr)}.ban{padding:10px 12px;border-radius:8px;margin:8px 0;font-weight:600}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--cd);border-left:1px solid var(--bd);z-index:40;transform:translateX(100%);transition:.15s;overflow:auto;padding:14px;box-shadow:-4px 0 16px #0002}#dr.open{transform:none}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#toasts{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;flex-direction:column;gap:6px}.toast{background:#14231a;color:#fff;padding:9px 14px;border-radius:8px;border-left:4px solid var(--gn);max-width:320px}.toast.wn{border-color:#e0a800}.toast.er{border-color:var(--red)}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);max-width:360px}
#splash{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#14231a}#splash img{width:min(300px,70%)}
.pl{display:none}@media print{#side,#top,button,.tb,.pg{display:none}#wrap{margin:0}.pl{display:block;margin-bottom:8px}}

.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.g3 .card{margin:0}.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:8px 0 10px}.kv span{color:var(--mu)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}.fg label,.mf label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu);text-transform:uppercase}.fg input,.fg select,.mf input,.mf select{width:100%;text-transform:none;font-size:13px}
.mf{display:grid;gap:8px;min-width:min(320px,80vw)}.k.sel{outline:2px solid var(--gn)}.stack>.card{margin-bottom:12px}dialog::backdrop{background:#0006}
.lv{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center;padding:3px 0}.lv .pb{width:100%;margin:0}.hb{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;padding:3px 0}.hb .bt{background:var(--bd);border-radius:3px}.hb b,.lv b{text-align:right}
#tl{height:28px;background:#fff;border-radius:6px;padding:2px 6px;border:1px solid var(--bd)}#pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(min-width:801px){#tl{display:none}}
@media(max-width:800px){#dte{display:none}#top{padding:8px 10px}.rt,.rt table,.rt tbody{width:100%;display:block}.rt tr{width:100%}}

.rt td[data-label=Material]{order:-2;font-size:15px;font-weight:700;border:0;justify-content:flex-start;text-align:left}.rt td[data-label=Kod]{order:-1;font-size:11px;color:var(--mu);border:0}.rt td[data-label=Material]:before,.rt td[data-label=Kod]:before{display:none}
.rt td input.in{width:120px;text-align:right}.tb{flex-wrap:wrap}.ph h2{font-size:18px}.ph>div:last-child{display:flex;flex-wrap:wrap}}

<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/"/g,'&quot;'),f=x=>(Math.round(x*100)/100).toLocaleString('az'),U=['ədəd','metr','sm','kq','litr','dəst','bağlama'];
const MENU_OLD=[['dash','📊 Dashboard'],['stock','📦 Anbar'],['calc','🧮 Tələbat hesablayıcı'],['pipes','⚙️ Borular'],['mats','➕ Materiallar'],['bom','🧩 BOM / Reseptlər'],['in','📥 Giriş'],['out','📤 Çıxış'],['buy','🛒 Satınalma'],['inv','📝 İnventarizasiya'],['rep','📋 Hesabatlar'],['set','🔧 Ayarlar'],['bak','💾 Backup']];
let S,pg='ctl',sel=null,qty=100,rep='stock',ph={};
const DB=new Promise(r=>{const q=indexedDB.open('anbar',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const load=async()=>{const d=await DB;if(!d)return;return new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>r(g.result)})};
const save=async()=>{__LU=null;const d=await DB;if(d)d.transaction('kv','readwrite').objectStore('kv').put(S,'s');schedSync()};
function seed(){const m=[],p=[];const M=(c,n,cat,sz,u,i,mn,mx,loc='A-1')=>m.push({c,n,cat,sz,u,init:i,min:mn,max:mx,res:0,loc,sup:'',note:''});
M('MN','Mis naqil','Mis naqil','2×1.5','metr',2000,200,10000);M('PU','Poliüretan köpük (PU)','İzolyasiya köpüyü','2 komponentli','kq',3000,300,10000);M('T001','Taxta (xam)','Taxta','kəsmə üçün','metr',300,50,1000);M('BOLT','Bolt M10','Ləvazimat','M10','ədəd',200,50,500);M('S001','Şlanq','Şlanq','-','metr',150,50,500);M('M001','Məftil','Məftil','-','metr',800,200,2000);
const N={108:[10,5,3.8,4,5,1,80],133:[10,5,4,4,5,1,90],159:[10,6,4,4,6,1,100],219:[10,6,4,5,6,1,100],273:[8,6,4,5,6,1,100],325:[12,6,4.5,5,6,1,110]};
for(const d in N){const n=N[d];M('B'+d,d+' mm polad boru','Polad boru',d+' mm','metr',600,60,3000);M('KL'+d,d+' mm kılıf','Kılıf',d+' mm','metr',600,60,3000);M('BL'+d,d+' mm bilərzik','Bilərzik',d+' mm','ədəd',d==108?300:100,100,2000);
p.push({id:+d,dia:+d,len:6,parts:[{c:'MN',q:2,per:'metr'},{c:'KL'+d,q:1,per:'metr'},{c:'PU',q:3.5,per:'metr'}],code:'B'+d,bil:'BL'+d,ringN:n[0],bagN:10,comps:[{c:'T001',q:n[1],l:n[2]},{c:'S001',q:n[3],l:n[4]},{c:'M001',q:n[5],l:n[6]}],bag:[{c:'M001',q:1,l:20}]})}
return{mats:m,pipes:p,moves:[],orders:[],seq:1,ver:3}}
const mat=c=>S.mats.find(x=>x.c==c),SG={'Giriş':1,'Qaytarma':1,'Düzəliş':1,'Çıxış':-1,'İstehsalda istifadə':-1,'Tullantı':-1,'Çatdırılma':-1,'Hazırlandı':1};
const cur=m=>m.init+S.moves.filter(x=>x.c==m.c).reduce((a,x)=>a+SG[x.t]*x.q,0)-LU(m.c),free=m=>cur(m)-m.res;
function need(c,q,l){const m=mat(c);if(l&&m.u=='metr')return q*l/100;if(l&&m.u=='kq')return m.kgm?q*l/100*m.kgm:0;return q}
function calc(p,m){const pn=m/ul(p),full=Math.floor(pn+1e-9),rem=+(m-full*p.len).toFixed(4),rings=Math.ceil(pn*p.ringN-1e-9),bun=Math.ceil(rings/p.bagN-1e-9),R={};
const add=(c,q,l,s)=>{if(!mat(c))return;const v=need(c,q,l);(R[c]=R[c]||{c,n:0,parts:[]});R[c].n+=v;R[c].parts.push(s+' '+f(v))};
add(p.code,m,0,'Boru');add(p.bil,rings,0,'Bilərzik');p.comps.forEach(k=>add(k.c,rings*k.q,k.l,'Bilərzik BOM'));p.bag.forEach(k=>add(k.c,bun*k.q,k.l,'Bağlama'));
return{pn,full,rem,rings,bun,rows:Object.values(R).map(o=>{const m=mat(o.c),fr=free(m);return{...o,m,cur:cur(m),fr,sh:Math.max(0,o.n-fr),ex:Math.max(0,fr-o.n)}})}}
const cls=(n,m)=>n.sh>0?'rd':(n.fr-n.n<m.min?'ye':'gr');
const st=m=>{const c=cur(m);return c<=0?['rd','🔴 STOK BİTİB']:c<m.min?['ye','⚠️ Minimumdan aşağı']:['gr','✔ Normal']};

const inp=(path,v,num,c='in')=>`<input class="${c}" ${num?'type=number step=any':''} value="${e(v)}" onchange="set('${path}',this.value,${num?1:0})">`;

function calcView(act){const p=S.pipes.find(x=>x.id==sel)||S.pipes[0];if(!p)return'<div class=card>Boru yoxdur</div>';sel=p.id;const r=calc(p,qty);
return`<div class=card><div class=row><label>Boru<select onchange="sel=+this.value;go()">${S.pipes.map(x=>`<option value=${x.id} ${x.id==sel?'selected':''}>${x.dia} mm</option>`).join('')}</select></label>
<label>Miqdar (metr)<input type=number value="${qty}" onchange="qty=+this.value||0;go()"></label>${act?`<button onclick="mkOrder()">📌 Sifariş yarat + rezerv</button><button class=g onclick="xl()">Excel-ə ixrac</button>`:''}</div>
<div class=grid><div class=k><b>${r.full} ədəd${r.rem?` + ${f(r.rem)} m`:''}</b><span>Boru sayı (1 boru = ${p.len} m)</span></div><div class=k><b>${f(r.rings)}</b><span>Bilərzik</span></div><div class=k><b>${f(r.bun)}</b><span>${p.bagN}-luq bağlama</span></div></div>
${tbl(['Material','Vahid','Tələb','Mənbə','Stok','Rezerv','Sərbəst','Çatışmazlıq','Artıq'],r.rows.map(o=>({cl:cls(o,o.m),c:[o.m.n,o.m.u,f(o.n),o.parts.join(' + '),f(o.cur),f(o.m.res),f(o.fr),f(o.sh),f(o.ex)]})))}</div>`}
function mkOrder(){const p=S.pipes.find(x=>x.id==sel),r=calc(p,qty),nd={};r.rows.forEach(o=>{nd[o.c]=o.n;o.m.res+=o.n});S.orders.push({id:S.seq++,date:new Date().toISOString().slice(0,10),pipe:p.dia,m:qty,st:'aktiv',nd});save();alert('Sifariş yaradıldı, materiallar rezerv olundu');go()}
function endOrder(i,ok){const o=S.orders[i];for(const c in o.nd){const m=mat(c);if(!m)continue;m.res=Math.max(0,m.res-o.nd[c]);if(ok)S.moves.push({d:o.date,no:'S'+o.id,c,t:'İstehsalda istifadə',q:o.nd[c],r:'Sifariş #'+o.id,pr:o.pipe+' mm '+o.m+' m',nt:''})}o.st=ok?'tamamlandı':'ləğv';save();go()}
function mv(type){const d=$('#md').value,c=$('#mc').value,t=$('#mt').value,q=+$('#mq').value;if(!q||!c)return alert('Miqdarı daxil edin');const m=mat(c);if(SG[t]<0&&cur(m)-q<0&&!confirm('Stok mənfiyə düşəcək. Davam?'))return;
S.moves.push({d,no:'H'+String(S.seq++).padStart(4,'0'),c,t,q,r:$('#mr').value,pr:$('#mp').value,nt:''});save();go()}
function mvView(k){const T=k=='in'?['Giriş','Qaytarma']:['Çıxış','Çatdırılma','İstehsalda istifadə','Tullantı','Düzəliş'];

<div class=card><h3>Son hərəkətlər</h3>${movesT(S.moves.slice(-30).reverse(),1)}</div>`}

function buyRows(){const p=S.pipes.find(x=>x.id==sel)||S.pipes[0];if(!p)return[];return calc(p,qty).rows.map(o=>{const after=o.fr-o.n,ex=Math.max(0,o.m.min-Math.max(after,0));return{...o,ex2:ex,buy:o.sh+ex}}).filter(o=>o.buy>0)}
function view0(){const M=S.mats;switch(pg){
case'dash':{const cr=M.filter(m=>cur(m)<m.min),ao=S.orders.filter(o=>o.st=='aktiv'),by=buyRows();
return`<h2>Dashboard</h2><div class=grid><div class=k><b>${M.length}</b><span>Material sayı</span></div><div class=k><b>${f(M.reduce((a,m)=>a+cur(m),0))}</b><span>Ümumi stok (vahidlər qarışıq)</span></div><div class="k ${cr.length?'rd':'gr'}"><b>${cr.length}</b><span>Kritik stoklar</span></div><div class=k><b>${ao.length}</b><span>Aktiv sifariş</span></div><div class="k ${by.length?'ye':'gr'}"><b>${by.length}</b><span>Satınalma ehtiyacı</span></div></div>${calcView(0)}

<div class=card><h3>Boru stokları</h3>${S.pipes.map(p=>{const m=mat(p.code),v=m?cur(m):0;return`<div>${p.dia} mm — ${f(v)} m<div class=bar style="width:${Math.min(100,v/(m?.max||1)*100)}%"></div></div>`}).join('')}</div>

case'stock':return`<div class=card><h2>Anbar</h2>${tbl(['Kod','Material','Kateqoriya','Ölçü','Vahid','Stok','Rezerv','Sərbəst','Min','Max','Yer','Status'],M.map(m=>({cl:st(m)[0],c:[m.c,m.n,m.cat,m.sz,m.u,f(cur(m)),f(m.res),f(free(m)),m.min,m.max,m.loc,st(m)[1]]})))}</div>`;

<div class=row><label>Yeni diametr (mm)<input id=nd type=number class=in></label><button onclick="addPipe()">Yeni boru əlavə et (BOM 108-dən köçürülür)</button></div><p class=mu>Norma dəyişmək üçün "BOM / Reseptlər" bölməsinə keçin.</p></div>`;
case'mats':return`<div class=card><h2>Materiallar</h2><div class=row>${['c:Kod','n:Ad','cat:Kateqoriya','sz:Ölçü','init:Başlanğıc stok','min:Min','max:Max','loc:Yer','sup:Təchizatçı','nt:Qeyd'].map(x=>{const[k,l]=x.split(':');return`<label>${l}<input id=nm_${k} class="${['init','min','max'].includes(k)?'in':'w'}"></label>`}).join('')}<label>Vahid<select id=nm_u>${U.map(u=>`<option>${u}</option>`).join('')}</select></label><button onclick="addMat()">➕ Əlavə et</button></div>
${tbl(['Kod','Ad','Kateqoriya','Ölçü','Vahid','Başl. stok','Min','Max','Rezerv','Yer','Təchizatçı','Qeyd',''],M.map((m,i)=>({c:[m.c,...['n','cat','sz'].map(k=>inp(`mats.${i}.${k}`,m[k],0,'w')),selUnit(`mats.${i}.u`,m.u),...['init','min','max','res'].map(k=>inp(`mats.${i}.${k}`,m[k],1)),...['loc','sup','nt'].map(k=>inp(`mats.${i}.${k}`,m[k]||'',0,'w')),`<button class=r onclick="del('mats',${i})">✕</button>`]})))}</div>`;
case'bom':{const i=Math.max(0,S.pipes.findIndex(x=>x.id==sel)),p=S.pipes[i];if(!p)return'';const ed=k=>tbl(['Material','Say','Uzunluq (sm)',''],p[k].map((c,j)=>({c:[`<select onchange="set('pipes.${i}.${k}.${j}.c',this.value,0)">${opt(c.c)}</select>`,inp(`pipes.${i}.${k}.${j}.q`,c.q,1),inp(`pipes.${i}.${k}.${j}.l`,c.l||0,1),`<button class=r onclick="del('pipes.${i}.${k}',${j})">✕</button>`]})))+`<button class=g onclick="S.pipes[${i}].${k}.push({c:S.mats[0].c,q:1,l:0});save();go()">+ komponent</button>`;
return`<h2>BOM / Reseptlər</h2><div class=card><label>Boru <select onchange="sel=+this.value;go()">${S.pipes.map(x=>`<option value=${x.id} ${x.id==sel?'selected':''}>${x.dia} mm</option>`).join('')}</select></label>
<h3>1 boru → ${p.ringN} bilərzik. Hər bilərzik üçün:</h3>${ed('comps')}<h3>${p.bagN} bilərzik → 1 bağlama. Hər bağlama üçün:</h3>${ed('bag')}<p class=mu>Uzunluq sm ilə yazılır (0 = uzunluq yoxdur, yalnız say). Sistem stok vahidinə avtomatik çevirir.</p></div>`}
case'in':return mvView('in');case'out':return mvView('out');

case'inv':return`<div class=card><h2>İnventarizasiya</h2>${tbl(['Kod','Material','Sistem stoku','Fiziki say','Fərq'],M.map((m,i)=>{const c=cur(m),v=ph[m.c],d=v===undefined||v===''?'':v-c;return{c:[m.c,m.n,f(c),`<input class=in type=number step=any value="${e(v??'')}" onchange="ph['${m.c}']=this.value;go()">`,d===''?'':`<b style="color:${d?'#d63c3c':'inherit'}">${f(d)}</b>`]}}))}<button onclick="applyInv()">Düzəlişləri yarat</button></div>`;
case'rep':{const R={stock:['Gündəlik stok',()=>tbl(['Material','Stok','Vahid'],M.map(m=>({c:[m.n,f(cur(m)),m.u]})))],crit:['Çatışan / kritik stoklar',()=>tbl(['Material','Stok','Min','Status'],M.filter(m=>cur(m)<m.min).map(m=>({cl:st(m)[0],c:[m.n,f(cur(m)),m.min,st(m)[1]]})))],moves:['Material hərəkətləri',()=>movesT([...S.moves].reverse())],month:['Aylıq giriş-çıxış',()=>{const o={};S.moves.forEach(x=>{const k=x.d.slice(0,7);o[k]=o[k]||[0,0];o[k][SG[x.t]>0?0:1]+=x.q});return tbl(['Ay','Giriş','Çıxış'],Object.keys(o).sort().map(k=>({c:[k,f(o[k][0]),f(o[k][1])]})))}],top:['Ən çox istifadə olunanlar',()=>{const o={};S.moves.filter(x=>SG[x.t]<0).forEach(x=>o[x.c]=(o[x.c]||0)+x.q);const a=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=a[0]?.[1]||1;return tbl(['Material','İstifadə',''],a.map(([c,v])=>({c:[mat(c)?.n||c,f(v),`<div class=bar style="width:${v/mx*150}px"></div>`]})))}],pipe:['Boru üzrə tələbat (aktiv sifarişlər)',()=>ordT(1)],cnt:['Ümumi material sayı',()=>tbl(['Kateqoriya','Say'],Object.entries(M.reduce((o,m)=>(o[m.cat]=(o[m.cat]||0)+1,o),{})).map(x=>({c:x})))]};

const ordT=a=>tbl(['№','Tarix','Boru','Metr','Status',''],S.orders.map((o,i)=>({o,i})).filter(x=>!a||x.o.st=='aktiv').map(({o,i})=>({c:[o.id,o.date,onm(o),o.m,o.st,o.st=='aktiv'?`<button onclick="endOrder(${i},1)">Tamamla</button><button class=r onclick="endOrder(${i},0)">Ləğv</button>`:'']})));
function addPipe(){const d=+$('#nd').value;if(!d||S.pipes.some(p=>p.dia==d))return alert('Diametr səhvdir və ya mövcuddur');const b=JSON.parse(JSON.stringify(S.pipes[0]||{len:1,ringN:10,bagN:10,comps:[],bag:[]}));
[['B'+d,d+' mm boru','Boru','metr'],['BL'+d,d+' mm bilərzik','Bilərzik','ədəd']].forEach(x=>{if(!mat(x[0]))S.mats.push({c:x[0],n:x[1],cat:x[2],sz:d+' mm',u:x[3],init:0,min:0,max:0,res:0,loc:'',sup:'',note:''})});Object.assign(b,{id:d,dia:d,code:'B'+d,bil:'BL'+d});S.pipes.push(b);save();go()}

const GSCODE=`const TOKEN = 'BURAYA_GIZLI_SOZ_YAZIN';
const COLS = ['mats','pipes','orders','moves','projects','food','emps','att','pays','partners','docs','offers','ships','rcvs','meta'];
function sh_(n){const ss=SpreadsheetApp.getActive();let s=ss.getSheetByName(n);if(!s){s=ss.insertSheet(n);s.appendRow(['key','json','updated','deleted']);}return s;}
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function doGet(){return out_({ok:1});}
function doPost(e){
  const lock=LockService.getScriptLock();
  try{
    const b=JSON.parse(e.postData.contents);
    if(b.token!==TOKEN)return out_({error:'auth'});
    if(b.action==='batch'){
      lock.waitLock(25000);
      const now=Date.now(),by={};
      b.ops.forEach(o=>(by[o.c]=by[o.c]||[]).push(o));
      for(const c in by){
        const s=sh_(c),last=s.getLastRow(),idx={};
        if(last>1)s.getRange(2,1,last-1,1).getValues().forEach((r,i)=>idx[r[0]]=i+2);
        by[c].forEach(o=>{
          if(o.del&&idx[o.k]){s.getRange(idx[o.k],3,1,2).setValues([[now,1]]);return;}
          const row=[o.k,o.del?'':o.j,now,o.del?1:0];
          if(idx[o.k])s.getRange(idx[o.k],1,1,4).setValues([row]);
          else{s.appendRow(row);idx[o.k]=s.getLastRow();}
        });
      }
      return out_({ok:1,now});
    }
    if(b.action==='pull'){
      const items=[],ss=SpreadsheetApp.getActive();
      COLS.forEach(c=>{
        const s=ss.getSheetByName(c);
        if(!s)return;
        const n=s.getLastRow()-1;
        if(n<1)return;
        const ups=s.getRange(2,3,n,1).getValues(),idx=[];
        ups.forEach((u,i)=>{if(Number(u[0])>b.since)idx.push(i);});
        if(!idx.length)return;
        const all=idx.length>40?s.getRange(2,1,n,4).getValues():null;
        idx.forEach(i=>{
          const r=all?all[i]:s.getRange(i+2,1,1,4).getValues()[0];
          items.push({c:c,k:r[0],j:r[1],u:r[2],del:r[3]==1});
        });
      });
      return out_({items:items,now:Date.now()});
    }
    return out_({error:'bad action'});
  }catch(err){return out_({error:String(err)});}
  finally{try{lock.releaseLock();}catch(x){}}
}`;
